[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "email-validator>=2.3.0",
    "bcrypt>=5.0.0",
    "pyjwt[crypto]>=2.12.1",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.26",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# alembicの自動生成テンプレートは op / sa をimportした状態で生成されるため、
# 使っていなくてもエラーにしない（自動生成のたびに発生するのを防ぐ）
"alembic/versions/*" = ["F401"]
# __init__.py のimportは「パッケージの公開API」としての意図的なre-export。
# 特に app/models/__init__.py はモデルをSQLAlchemyのBaseに登録する役割があり、
# 消すとalembicの自動生成が壊れる
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
