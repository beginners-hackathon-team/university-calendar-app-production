<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: sans-serif;
      font-size: 14px;
    }
    h3 { margin: 0 0 12px; font-size: 15px; }
    label { display: block; margin-bottom: 4px; color: #555; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #1648c0; }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h3>カレンダー拡張機能</h3>
  <label for="token">アクセストークン</label>
  <input type="text" id="token" placeholder="JWTトークンを貼り付け" />
  <button id="save">保存する</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
